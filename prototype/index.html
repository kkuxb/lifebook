<!doctype html>
<html lang="zh-CN" data-theme="light" data-device="desktop">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人生簿 · 交互原型</title>
<style>
:root{
  --bg:#F6F7FA;
  --surface:#FFFFFF;
  --surface-2:#F2F3F7;
  --surface-hover:#F5F6FA;
  --paper:#FCFBF8;
  --paper-border:#ECE7DC;
  --border:#E8EAF1;
  --border-strong:#D5D9E4;
  --line:#EEF0F5;
  --ink:#111827;
  --ink-2:#4B5263;
  --ink-3:#6B7280;
  --ink-4:#9CA3AF;
  --accent:#FFD43B;
  --accent-hover:#FFCC1A;
  --accent-ink:#111827;
  --accent-soft:#FFF7D1;
  --dark-btn:#111827;
  --dark-btn-ink:#FFFFFF;
  --dark-btn-hover:#000000;
  --ok-bg:#ECFDF3;
  --ok-line:#B7E4C7;
  --ok-ink:#146C43;
  --ok-dot:#10B981;
  --warn-bg:#FFF7F1;
  --warn-line:#FFB38A;
  --warn-ink:#9A3A0A;
  --warn-dot:#F97316;
  --danger:#E11D48;
  --danger-ink:#C8203E;
  --danger-bg:#FFF1F2;
  --shadow-sm:0 1px 2px rgba(17,24,39,.04),0 10px 24px -16px rgba(17,24,39,.16);
  --shadow-lg:0 4px 10px rgba(17,24,39,.06),0 22px 42px -18px rgba(17,24,39,.24);
  --shadow-btn:inset 0 1px 0 rgba(255,255,255,.55),0 8px 18px -10px rgba(214,160,0,.9);
  --mark-bg:rgba(255,212,59,.55);
  --heat-0:#EBEEF5;
  --heat-1:#CBE4FA;
  --heat-2:#7CC0F5;
  --heat-3:#FBBF24;
  --heat-4:#EA580C;
  --ai-bg:#FFF7D1;
  --ai-ink:#9A5800;
  --ai-border:#F3DDA0;
  --code-bg:#F3F4F6;
  --quote-bg:#F7F4EC;
  --header-blur:rgba(246,247,250,.88);
  --font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --font-mono:"Cascadia Mono","Consolas","PingFang SC",monospace;
}
html[data-theme="dark"]{
  --bg:#111318;
  --surface:#191D26;
  --surface-2:#222734;
  --surface-hover:#242A38;
  --paper:#1D212B;
  --paper-border:#2C3242;
  --border:#262B38;
  --border-strong:#353C4E;
  --line:#252B38;
  --ink:#ECEFF6;
  --ink-2:#B5BDCE;
  --ink-3:#8A94A8;
  --ink-4:#667085;
  --accent:#F5C83B;
  --accent-hover:#FFD43B;
  --accent-ink:#111827;
  --accent-soft:rgba(245,200,59,.18);
  --dark-btn:#ECEFF6;
  --dark-btn-ink:#111827;
  --dark-btn-hover:#FFFFFF;
  --ok-bg:#14261D;
  --ok-line:#24533B;
  --ok-ink:#6EE7B7;
  --ok-dot:#34D399;
  --warn-bg:#2A1C16;
  --warn-line:#6A3D28;
  --warn-ink:#FDBA8C;
  --warn-dot:#FB923C;
  --danger:#FB7185;
  --danger-ink:#FDA4AF;
  --danger-bg:#331820;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35),0 10px 24px -16px rgba(0,0,0,.55);
  --shadow-lg:0 6px 14px rgba(0,0,0,.45),0 24px 44px -18px rgba(0,0,0,.7);
  --shadow-btn:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px -10px rgba(245,200,59,.45);
  --mark-bg:rgba(245,200,59,.35);
  --heat-0:#202532;
  --heat-1:#1E3A5F;
  --heat-2:#2B6CB0;
  --heat-3:#D99B16;
  --heat-4:#F97316;
  --ai-bg:rgba(245,200,59,.16);
  --ai-ink:#FCD34D;
  --ai-border:rgba(245,200,59,.34);
  --code-bg:#141821;
  --quote-bg:#232836;
  --header-blur:rgba(17,19,24,.88);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* 外壳：支持桌面宽屏与手机居中画框预览 */
.device-stage{min-height:100vh;display:flex;flex-direction:column;align-items:center}
.app-frame{width:100%;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);transition:width .3s cubic-bezier(.2,.8,.2,1),border-radius .3s,box-shadow .3s}
html[data-device="mobile"] .device-stage{padding:20px 12px 32px;background:repeating-radial-gradient(circle at 20% 20%,rgba(125,135,160,.07) 0 1px,transparent 1px 22px),var(--bg)}
html[data-device="mobile"] .app-frame{width:396px;max-width:100%;min-height:812px;max-height:860px;overflow-y:auto;overflow-x:hidden;border-radius:34px;border:8px solid #1E2430;box-shadow:0 24px 60px rgba(0,0,0,.28);position:relative}
html[data-theme="dark"][data-device="mobile"] .app-frame{border-color:#2E3546}

/* 顶部吸顶栏 */
.topbar-wrap{position:sticky;top:0;z-index:40;background:var(--header-blur);backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s,background-color .25s}
.topbar-wrap.scrolled{border-bottom-color:var(--border)}
.topbar{max-width:1280px;margin:0 auto;padding:14px 36px;display:flex;align-items:center;justify-content:space-between;gap:14px}
html[data-device="mobile"] .topbar{padding:12px 16px;gap:8px}
.brand{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:0;text-align:left}
.brand-logo{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-btn);flex:none;transition:transform .2s}
.brand:hover .brand-logo{transform:translateY(-1px) rotate(-3deg)}
.brand-name{font-size:19px;font-weight:800;letter-spacing:-.01em}
.brand-sub{font-size:11px;font-weight:700;color:var(--ink-3);margin-top:1px}
html[data-device="mobile"] .brand-sub{display:none}

.nav-pills{display:flex;align-items:center;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px;box-shadow:var(--shadow-sm)}
html[data-device="mobile"] .nav-pills.desktop-nav{display:none}
.nav-pill{border:0;background:transparent;color:var(--ink-2);height:38px;padding:0 18px;border-radius:10px;font-size:14px;font-weight:800;transition:all .2s;white-space:nowrap}
.nav-pill:hover{color:var(--ink);background:var(--surface-hover)}
.nav-pill.active{background:var(--dark-btn);color:var(--dark-btn-ink)}

.top-actions{display:flex;align-items:center;gap:8px}
.seg-mini{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px}
.seg-mini button{border:0;background:transparent;color:var(--ink-3);height:30px;padding:0 10px;border-radius:9px;font-size:12px;font-weight:700;transition:all .18s}
.seg-mini button.active{background:var(--surface-2);color:var(--ink)}
html[data-device="mobile"] .hide-mobile{display:none!important}

.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;transition:all .2s}
.icon-btn:hover{transform:translateY(-2px);color:var(--ink);border-color:var(--border-strong)}
.icon-btn:active{transform:scale(.96)}

.sync-pill{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--ok-line);background:var(--ok-bg);color:var(--ok-ink);font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:all .2s}
.sync-pill.syncing{border-color:var(--border-strong);background:var(--surface);color:var(--ink-2)}
.sync-pill.offline{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn-ink)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.sync-pill.ok .sync-dot{color:var(--ok-dot);animation:ping 2s ease-out infinite}
.sync-pill.offline .sync-dot{color:var(--warn-dot)}
html[data-device="mobile"] .sync-text-full{display:none}

/* 手机端底部四栏导航 */
.mobile-bottom-nav{display:none}
html[data-device="mobile"] .mobile-bottom-nav{display:grid;grid-template-columns:repeat(4,1fr);position:sticky;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);padding:6px 8px 10px;margin-top:auto}
.mnav-btn{border:0;background:transparent;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:12px;font-size:11px;font-weight:800}
.mnav-btn.active{color:var(--ink);background:var(--surface-2)}

/* 通用表面与按钮 */
.main-wrap{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:24px 36px 72px}
html[data-device="mobile"] .main-wrap{padding:16px 16px 28px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-sm);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s,background-color .25s}
.lift:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.paper-card{background:var(--paper);border:1px solid var(--paper-border);border-radius:20px;box-shadow:var(--shadow-sm)}

.btn{border:0;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:800;white-space:nowrap;border-radius:12px;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background-color .2s,color .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-btn);height:48px;padding:0 24px;font-size:15px;border-radius:14px}
.btn-primary:hover{background:var(--accent-hover)}
.btn-dark{background:var(--dark-btn);color:var(--dark-btn-ink);height:40px;padding:0 16px;font-size:13px}
.btn-dark:hover{background:var(--dark-btn-hover)}
.btn-soft{background:var(--surface-2);color:var(--ink);height:38px;padding:0 14px;font-size:13px}
.btn-soft:hover{background:var(--surface-hover);box-shadow:inset 0 0 0 1px var(--border-strong)}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--border);height:38px;padding:0 14px;font-size:13px}
.btn-ghost:hover{border-color:var(--border-strong)}
.btn-danger-soft{background:var(--danger-bg);color:var(--danger-ink);height:36px;padding:0 12px;font-size:12px;border:1px solid transparent}

.chip{display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.badge-count{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:800}

/* 首页样式 */
.hero-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:28px}
.hero-title{margin:0;font-size:40px;line-height:1.12;font-weight:900;letter-spacing:-.02em}
html[data-device="mobile"] .hero-title{font-size:30px}
.hl-date{background:linear-gradient(transparent 62%,var(--accent) 62%,var(--accent) 92%,transparent 92%);padding:0 4px}
.hero-sub{margin:10px 0 0;font-size:14px;font-weight:600;color:var(--ink-3);display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hero-btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
html[data-device="mobile"] .hero-btns{width:100%}
html[data-device="mobile"] .hero-btns .btn-primary{flex:1}

.sec-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sec-title{margin:0;font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px}

.otd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-bottom:28px}
.otd-card{padding:18px 20px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;width:100%;border:1px solid var(--border)}
.otd-year{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--ink-2);background:var(--surface-2);padding:4px 10px;border-radius:999px}
.otd-excerpt{font-size:13px;line-height:1.65;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}

/* 热力图 */
.heat-card{padding:22px 24px;margin-bottom:28px}
html[data-device="mobile"] .heat-card{padding:16px}
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 18px}
html[data-device="mobile"] .kpi-strip{grid-template-columns:repeat(2,1fr)}
.kpi-mini{background:var(--surface-hover);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi-mini .k-label{font-size:12px;font-weight:700;color:var(--ink-3)}
.kpi-mini .k-val{font-size:24px;font-weight:900;margin-top:4px;letter-spacing:-.02em}
.heat-scroll{overflow-x:auto;padding-bottom:6px}
.heat-grid{display:grid;grid-template-columns:repeat(53,13px);grid-template-rows:repeat(7,13px);grid-auto-flow:column;gap:4px;min-width:860px}
.h-cell{width:13px;height:13px;border-radius:3.5px;background:var(--heat-0);border:0;padding:0;transition:transform .14s,outline .14s}
.h-cell:hover{transform:scale(1.35);outline:2px solid var(--ink);outline-offset:1px;z-index:2}
.h-cell.empty-pad{background:transparent;pointer-events:none}
.heat-legend{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;color:var(--ink-3);font-weight:600}
.legend-boxes{display:inline-flex;align-items:center;gap:4px}
.legend-boxes i{display:inline-block;width:12px;height:12px;border-radius:3px}

/* 标签墙 */
.tags-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
html[data-device="mobile"] .tags-grid{grid-template-columns:1fr 1fr;gap:10px}
.tag-wall-card{padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer}
.tag-wall-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag-wall-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag-quick-btn{border:1px solid var(--border);background:var(--surface-2);color:var(--ink-2);height:28px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:800;transition:all .16s}
.tag-quick-btn:hover{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* 沉浸式写作页 */
.editor-shell{display:flex;gap:22px;align-items:flex-start;justify-content:center}
.editor-main-col{flex:1;max-width:780px;width:100%;min-width:0}
.editor-toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.save-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-3);background:var(--surface);border:1px solid var(--border);height:32px;padding:0 12px;border-radius:999px}
.paper-canvas{padding:36px 44px 54px;position:relative}
html[data-device="mobile"] .paper-canvas{padding:20px 18px 36px;border-radius:18px}
.paper-meta-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.date-input-pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700}
.date-input-pill input{border:0;background:transparent;font-size:13px;font-weight:800;outline:none}
.doc-title-input{width:100%;border:0;background:transparent;font-size:28px;font-weight:900;line-height:1.3;outline:none;padding:4px 0;margin-bottom:12px;letter-spacing:-.01em}
html[data-device="mobile"] .doc-title-input{font-size:22px}
.doc-title-input::placeholder{color:var(--ink-4)}

.meta-chips-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-bottom:18px;margin-bottom:20px;border-bottom:1px solid var(--paper-border);position:relative}
.add-meta-btn{border:1px dashed var(--border-strong);background:transparent;color:var(--ink-3);height:27px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:4px;transition:all .16s}
.add-meta-btn:hover{border-color:var(--ink);color:var(--ink);background:var(--surface-2)}

.popover-panel{position:absolute;top:calc(100% - 8px);left:0;z-index:35;background:var(--surface);border:1px solid var(--border-strong);border-radius:16px;padding:14px;box-shadow:var(--shadow-lg);width:320px;max-width:90vw}
.popover-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pick-opt{border:1px solid var(--border);background:var(--surface-2);color:var(--ink-2);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;transition:all .15s}
.pick-opt.selected{background:var(--dark-btn);color:var(--dark-btn-ink);border-color:transparent}

/* 块级编辑器正文 */
.editor-blocks{min-height:360px;outline:none;font-size:16px;line-height:1.85;color:var(--ink)}
.editor-blocks h2{font-size:22px;font-weight:800;margin:22px 0 10px;line-height:1.35}
.editor-blocks h3{font-size:17.5px;font-weight:800;margin:20px 0 8px;padding-left:10px;border-left:3.5px solid var(--accent);line-height:1.4}
.editor-blocks p{margin:0 0 10px}
.editor-blocks ul,.editor-blocks ol{margin:4px 0 12px;padding-left:22px}
.editor-blocks li{margin:4px 0}
.editor-blocks blockquote{margin:12px 0;padding:10px 14px;border-left:3.5px solid var(--border-strong);background:var(--quote-bg);border-radius:0 12px 12px 0;color:var(--ink-2)}
.editor-blocks pre{margin:12px 0;padding:12px 14px;background:var(--code-bg);border:1px solid var(--border);border-radius:12px;font-family:var(--font-mono);font-size:13.5px;line-height:1.6;overflow-x:auto}
.editor-blocks hr{border:0;border-top:1.5px dashed var(--border-strong);margin:20px 0}
.editor-blocks mark{background:var(--mark-bg);color:inherit;padding:1px 3px;border-radius:4px}
.todo-block{display:flex;align-items:flex-start;gap:9px;margin:6px 0}
.todo-block input[type="checkbox"]{width:17px;height:17px;margin-top:6px;accent-color:var(--accent-ink);cursor:pointer;flex:none}
.todo-block .todo-text{flex:1;outline:none}
.todo-block.done .todo-text{text-decoration:line-through;color:var(--ink-3)}
.img-block{margin:14px 0;padding:10px;border:1px solid var(--border);border-radius:14px;background:var(--surface)}
.img-block img{width:100%;max-height:340px;object-fit:cover;border-radius:10px;display:block}
.img-caption{font-size:12px;color:var(--ink-3);margin-top:6px;text-align:center}

.editor-bottom-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:26px;padding-top:14px;border-top:1px dashed var(--paper-border);font-size:12px;color:var(--ink-3)}
.shortcut-tip{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.kbd{display:inline-block;padding:2px 6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--ink-2)}

/* 斜杠菜单与划词工具栏 */
.slash-menu{position:fixed;z-index:80;width:256px;max-height:340px;overflow-y:auto;background:var(--surface);border:1px solid var(--border-strong);border-radius:16px;padding:6px;box-shadow:var(--shadow-lg)}
.slash-menu-head{font-size:11px;font-weight:800;color:var(--ink-3);padding:6px 10px 4px}
.slash-item{width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:10px;display:flex;align-items:center;gap:10px;transition:background-color .12s}
.slash-item:hover,.slash-item.active{background:var(--surface-2)}
.slash-icon{width:30px;height:30px;border-radius:8px;background:var(--surface-hover);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none}
.slash-item.active .slash-icon{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.slash-name{font-size:13px;font-weight:800}
.slash-desc{font-size:11px;color:var(--ink-3)}

.float-bar{position:fixed;z-index:85;display:inline-flex;align-items:center;gap:2px;background:#111827;color:#FFFFFF;padding:4px;border-radius:11px;box-shadow:0 10px 26px rgba(0,0,0,.32)}
html[data-theme="dark"] .float-bar{background:#ECEFF6;color:#111827}
.float-bar button{border:0;background:transparent;color:inherit;height:28px;padding:0 9px;border-radius:8px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:4px}
.float-bar button:hover{background:rgba(128,128,128,.22)}

/* 右侧那年今日对照面板 */
.otd-drawer{width:330px;flex:none;padding:18px;position:sticky;top:84px;max-height:calc(100vh - 110px);overflow-y:auto}
html[data-device="mobile"] .editor-shell{flex-direction:column}
html[data-device="mobile"] .otd-drawer{width:100%;position:static;max-height:none}
.otd-drawer-item{padding:14px;border-radius:14px;background:var(--surface-hover);border:1px solid var(--line);margin-top:12px}
.otd-drawer-body{font-size:13px;line-height:1.7;color:var(--ink-2);margin-top:8px;white-space:pre-line}

/* 日历视图 */
.cal-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.cal-card{padding:16px}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px;text-align:center;font-size:12px;font-weight:800;color:var(--ink-3)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
html[data-device="mobile"] .cal-grid{gap:4px}
.cal-cell{min-height:108px;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:all .18s;position:relative}
html[data-device="mobile"] .cal-cell{min-height:66px;padding:6px;border-radius:10px}
.cal-cell:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.cal-cell.other-month{opacity:.38}
.cal-cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-cell-top{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:800}
.cal-cell-title{font-size:12px;font-weight:700;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:4px 0}
html[data-device="mobile"] .cal-cell-title,html[data-device="mobile"] .cal-cell-foot{display:none}
.cal-cell-foot{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--ink-3)}
.cal-empty-hint{font-size:11px;font-weight:700;color:var(--ink-4);opacity:0;transition:opacity .15s}
.cal-cell:hover .cal-empty-hint{opacity:1;color:var(--ink-2)}

/* 历史与全文检索 */
.search-bar-box{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:16px;margin-bottom:14px}
.search-bar-box input{flex:1;border:0;background:transparent;font-size:15px;font-weight:600;outline:none;height:36px}
.filter-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:18px}
.select-pill{height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);padding:0 12px;font-size:13px;font-weight:700;outline:none}
.hist-list{display:flex;flex-direction:column;gap:10px}
.hist-row{padding:16px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.hist-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.hist-card{padding:20px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.hist-card-snippet{font-size:13px;line-height:1.68;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
mark.search-hl{background:var(--mark-bg);color:var(--ink);padding:0 3px;border-radius:4px;font-weight:800}

/* 统计分析 */
.stats-grid-2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:16px}
html[data-device="mobile"] .stats-grid-2{grid-template-columns:1fr}
.chart-card{padding:22px 24px}
.bar-row{display:flex;align-items:center;gap:10px;margin:10px 0}
.bar-label{width:84px;font-size:13px;font-weight:700;color:var(--ink-2);flex:none}
.bar-track{flex:1;height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;transition:width .4s ease}
.bar-val{width:46px;text-align:right;font-size:12px;font-weight:800;color:var(--ink-3)}

/* 模态与设置抽屉 */
.modal-mask{position:fixed;inset:0;z-index:90;background:rgba(15,20,30,.46);backdrop-filter:blur(3px);display:flex;justify-content:flex-end}
.drawer-panel{width:540px;max-width:100vw;height:100vh;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slideIn .24s cubic-bezier(.2,.8,.2,1)}
.drawer-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.drawer-tabs{display:flex;gap:4px;padding:10px 24px;border-bottom:1px solid var(--border);overflow-x:auto}
.drawer-tab{border:0;background:transparent;color:var(--ink-3);height:34px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:800;white-space:nowrap}
.drawer-tab.active{background:var(--surface-2);color:var(--ink)}
.drawer-body{flex:1;overflow-y:auto;padding:20px 24px 36px}
.sub-card{padding:16px;border-radius:16px;border:1px solid var(--border);background:var(--surface-hover);margin-bottom:14px}

.center-modal-mask{position:fixed;inset:0;z-index:95;background:rgba(15,20,30,.46);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px}
.center-modal{width:440px;max-width:100%;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:24px;box-shadow:var(--shadow-lg);animation:pop .22s cubic-bezier(.2,.8,.2,1)}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:120;background:var(--dark-btn);color:var(--dark-btn-ink);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:800;box-shadow:var(--shadow-lg);animation:pop .2s ease}

/* 智能摘要与降级标记 */
.ai-badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;background:var(--ai-bg);color:var(--ai-ink);border:1px solid var(--ai-border);font-size:11px;font-weight:800;white-space:nowrap}
.raw-badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-3);border:1px solid var(--border);font-size:11px;font-weight:700;white-space:nowrap}
.mini-toggle{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:2px;gap:2px}
.mini-toggle button{border:0;background:transparent;color:var(--ink-3);height:24px;padding:0 9px;border-radius:7px;font-size:11.5px;font-weight:800;white-space:nowrap}
.mini-toggle button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* 首页回忆问答对话框 */
.qa-card{padding:20px 24px;margin-bottom:26px;background:linear-gradient(135deg,var(--surface) 0%,var(--surface-hover) 100%)}
html[data-device="mobile"] .qa-card{padding:16px}
.qa-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.qa-title{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:900;margin:0}
.qa-prompts{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.qa-prompt-pill{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;transition:all .16s;text-align:left}
.qa-prompt-pill:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.qa-input-row{display:flex;gap:8px;margin-top:12px}
.qa-input-row input{flex:1;height:42px;border-radius:12px;border:1px solid var(--border-strong);background:var(--surface);padding:0 14px;font-size:13.5px;font-weight:600;outline:none}
.qa-input-row input:focus{border-color:var(--ink-2)}
.qa-thread{display:flex;flex-direction:column;gap:12px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--border)}
.qa-msg-user{align-self:flex-end;max-width:84%;background:var(--dark-btn);color:var(--dark-btn-ink);padding:10px 14px;border-radius:16px 16px 4px 16px;font-size:13.5px;font-weight:700;line-height:1.55}
.qa-msg-ai{align-self:stretch;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.qa-trace{border-radius:11px;background:var(--surface-hover);border:1px solid var(--line);padding:8px 12px;font-size:12px;color:var(--ink-2)}
.qa-trace-head{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;font-weight:800;width:100%;border:0;background:transparent;padding:0;text-align:left}
.qa-trace-steps{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);display:flex;flex-direction:column;gap:5px}
.qa-answer-text{font-size:14px;line-height:1.75;color:var(--ink);white-space:pre-line}
.qa-cites{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.cite-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--ai-border);background:var(--ai-bg);color:var(--ai-ink);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;transition:transform .16s}
.cite-chip:hover{transform:translateY(-2px)}

/* 历史日期范围筛选 */
.date-presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.preset-pill{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);height:32px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:700;transition:all .15s}
.preset-pill.active{background:var(--dark-btn);color:var(--dark-btn-ink);border-color:transparent}
.date-range-inputs{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0 10px;height:36px;font-size:12.5px;font-weight:700}
.date-range-inputs input[type="date"]{border:0;background:transparent;font-size:12.5px;font-weight:700;outline:none}

/* 日历补算按钮 */
.cal-recalc-btn{border:1px solid var(--ai-border);background:var(--ai-bg);color:var(--ai-ink);border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:800}

/* 统计趣味洞察专区 */
.insight-sec{margin-top:26px}
.insight-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:14px}
html[data-device="mobile"] .insight-grid{grid-template-columns:1fr}
.insight-card{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.dual-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
html[data-device="mobile"] .dual-col{grid-template-columns:1fr}
.dual-box{background:var(--surface-hover);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.topic-cloud{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.topic-pill{border:1px solid var(--border);background:var(--surface-hover);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:800;display:inline-flex;align-items:center;gap:5px;transition:all .16s}
.topic-pill:hover{background:var(--accent-soft);border-color:var(--accent)}
.highlight-timeline{display:flex;flex-direction:column;gap:10px}
.hl-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface-hover);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.hl-item:hover{border-color:var(--border-strong)}
.hl-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}
.portrait-card{background:linear-gradient(145deg,var(--paper) 0%,var(--surface) 100%);border:1px solid var(--paper-border);border-radius:16px;padding:16px;font-size:13.5px;line-height:1.8;color:var(--ink-2)}

/* 设置抽屉增强与居中迁移模态框 */
.form-field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.form-label{font-size:12.5px;font-weight:800;color:var(--ink-2)}
.form-input{height:38px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);padding:0 12px;font-size:13px;font-weight:600;outline:none;width:100%}
.form-input:focus{border-color:var(--ink-2)}
.conn-result{padding:10px 12px;border-radius:11px;font-size:12.5px;font-weight:700;line-height:1.5;margin-top:10px}
.conn-result.ok{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok-ink)}
.conn-result.err{background:var(--danger-bg);border:1px solid var(--danger);color:var(--danger-ink)}
.progress-bar{height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:10px 0}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#F97316);transition:width .25s ease}
.manage-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border-radius:11px;border:1px solid var(--border);background:var(--surface);margin-bottom:7px;flex-wrap:wrap}
.color-dots{display:flex;flex-wrap:wrap;gap:6px}
.color-dot-btn{width:20px;height:20px;border-radius:50%;border:2px solid transparent;padding:0}
.color-dot-btn.active{border-color:var(--ink);transform:scale(1.12)}
.modal-overlay-top{z-index:110}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none!important;box-shadow:none!important}

/* 第 3 版统计页：周期复盘、时间簿联动与双高光时间轴 */
.review-shell{margin-top:26px;display:flex;flex-direction:column;gap:14px}
.review-controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.period-pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lock-banner{padding:22px 24px;border-radius:18px;border:1.5px dashed var(--border-strong);background:var(--surface-hover);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.tb-cross-card{padding:18px 20px;border:1px solid var(--border);border-radius:18px;background:var(--surface)}
.tb-bar-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12.5px}
.tb-bar-name{width:92px;font-weight:800;color:var(--ink);flex:none}
.tb-bar-track{flex:1;height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.tb-bar-fill{height:100%;border-radius:999px}
.tb-bar-meta{width:118px;text-align:right;font-size:12px;font-weight:700;color:var(--ink-3);flex:none}
.dim-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
html[data-device="mobile"] .dim-grid{grid-template-columns:1fr}
.dim-box{padding:16px 18px;border-radius:16px;border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.quarter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
html[data-device="mobile"] .quarter-grid{grid-template-columns:repeat(2,1fr)}
.quarter-box{padding:14px;border-radius:14px;background:var(--surface-hover);border:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.hl-item-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:11px 13px;border-radius:13px;background:var(--surface-hover);border:1px solid var(--line)}
.hl-main-btn{flex:1;display:flex;gap:10px;align-items:flex-start;border:0;background:transparent;padding:0;text-align:left;min-width:0}
.hl-main-btn:hover .hl-title-text{text-decoration:underline}
.algo-tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--ink-3);font-size:11px;font-weight:700;white-space:nowrap}
.pin-badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;background:var(--ai-bg);border:1px solid var(--ai-border);color:var(--ai-ink);font-size:11px;font-weight:800;white-space:nowrap}
.hl-actions{display:flex;align-items:center;gap:4px;flex:none}
.hl-op-btn{border:1px solid var(--border);background:var(--surface);color:var(--ink-3);height:24px;padding:0 7px;border-radius:7px;font-size:11px;font-weight:700}
.hl-op-btn:hover{border-color:var(--ink-2);color:var(--ink)}

@keyframes ping{0%{box-shadow:0 0 0 0 currentColor}75%,100%{box-shadow:0 0 0 7px transparent}}
@keyframes slideIn{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateY(10px) scale(.97);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="device-stage">
  <div class="app-frame" id="appFrame">

    <!-- 吸顶导航栏 -->
    <header class="topbar-wrap" id="topbarWrap">
      <div class="topbar">
        <button class="brand" id="brandBtn" title="回到首页">
          <span class="brand-logo" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M9 7h6"/><path d="M9 11h4"/></svg>
          </span>
          <span>
            <div class="brand-name">人生簿</div>
            <div class="brand-sub">私密每日日记 · 交互原型</div>
          </span>
        </button>

        <nav class="nav-pills desktop-nav" aria-label="主导航">
          <button class="nav-pill active" data-view="home">首页</button>
          <button class="nav-pill" data-view="calendar">日历</button>
          <button class="nav-pill" data-view="history">历史</button>
          <button class="nav-pill" data-view="stats">统计</button>
        </nav>

        <div class="top-actions">
          <div class="seg-mini hide-mobile" title="预览桌面或手机排版">
            <button id="devDesktopBtn" class="active" data-device-btn="desktop">电脑</button>
            <button id="devMobileBtn" data-device-btn="mobile">手机</button>
          </div>
          <button class="icon-btn" id="themeToggleBtn" title="切换浅色 / 夜间深色模式" aria-label="切换浅色或夜间深色模式"></button>
          <button class="sync-pill ok" id="syncPillBtn" title="点击模拟切换同步状态">
            <span class="sync-dot"></span>
            <span class="sync-text-full" id="syncText">数据已同步</span>
          </button>
          <button class="icon-btn" id="openSettingsBtn" title="设置与历史导入" aria-label="打开设置">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-wrap" id="mainWrap"></main>

    <!-- 手机端底部四栏导航 -->
    <nav class="mobile-bottom-nav" aria-label="手机端导航">
      <button class="mnav-btn active" data-view="home"><span>🏠</span><span>首页</span></button>
      <button class="mnav-btn" data-view="calendar"><span>📅</span><span>日历</span></button>
      <button class="mnav-btn" data-view="history"><span>🔎</span><span>历史</span></button>
      <button class="mnav-btn" data-view="stats"><span>📊</span><span>统计</span></button>
    </nav>
  </div>
</div>

<!-- 浮层：斜杠命令菜单 -->
<div class="slash-menu hidden" id="slashMenu"></div>

<!-- 浮层：划词格式工具栏 -->
<div class="float-bar hidden" id="floatBar">
  <button data-fmt="bold" title="加粗"><b>加粗</b></button>
  <button data-fmt="italic" title="斜体"><i>斜体</i></button>
  <button data-fmt="highlight" title="暖黄高亮">🖍 高亮</button>
  <button data-fmt="strike" title="删除线"><s>划线</s></button>
</div>

<!-- 隐藏文件选择器（本地图片上传演示） -->
<input type="file" id="imagePickerInput" accept="image/*" class="hidden">

<!-- 抽屉与弹窗容器 -->
<div id="modalRoot"></div>
<div id="centerModalRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){

  function buildAiDigest(title, html, dateStr){
    const raw = stripHtml(html);
    const shortTitle = (title && title.trim()) ? title.trim().slice(0, 18) : `${dateStr} 生活随记概要`;
    const aiSummary = raw ? (raw.slice(0, 82) + (raw.length > 82 ? "…" : "")) : "今日已开启记录，待补充具体生活片段。";
    return { aiShortTitle: shortTitle, aiSummary };
  }

  function saveCurrentEditor(){
    const ed = state.editor;
    const words = countWords(ed.html);
    if(!ed.title.trim() && words < 3){
      ed.saveText = `草稿待写 · ${words} 字`;
      return;
    }
    const fallbackMood = state.moods[2] ? state.moods[2].label : (state.moods[0] ? state.moods[0].label : "😌 平静");
    const fallbackTag = getActiveTags()[0] ? getActiveTags()[0].name : "日常记录";
    const resolvedTitle = ed.title.trim() || `${ed.date} 日常记录`;
    const digest = buildAiDigest(resolvedTitle, ed.html, ed.date);
    const existing = state.entries.find(x => x.id === ed.id || (ed.kind === "daily" && x.kind === "daily" && x.date === ed.date));
    const payload = {
      id: ed.id || ((ed.kind === "daily" ? "d-" : "s-") + Date.now()),
      kind: ed.kind,
      date: ed.date,
      title: resolvedTitle,
      aiShortTitle: digest.aiShortTitle,
      aiSummary: digest.aiSummary,
      aiTopics: existing?.aiTopics || [ed.tags[0] || "日常"],
      aiQuote: existing?.aiQuote || "",
      aiReady: state.aiConfig.enabled ? true : (existing ? existing.aiReady : false),
      moods: ed.moods.length ? [...ed.moods] : [fallbackMood],
      tags: ed.tags.length ? [...ed.tags] : [fallbackTag],
      html: ed.html
    };
    const idx = state.entries.findIndex(x => x.id === payload.id || (payload.kind === "daily" && x.kind === "daily" && x.date === payload.date));
    if(idx >= 0){
      state.entries[idx] = payload;
      ed.id = payload.id;
    } else {
      state.entries.unshift(payload);
      ed.id = payload.id;
    }
    if(payload.kind === "daily"){
      heatMap[payload.date] = {
        date: payload.date,
        wc: words,
        mood: payload.moods[0],
        title: payload.title,
        aiShortTitle: payload.aiShortTitle,
        aiReady: payload.aiReady,
        realId: payload.id
      };
    }
    ed.saveText = state.aiConfig.enabled ? `已保存并静默更新摘要 · ${words} 字` : `已自动保存 · ${words} 字`;
    const sb = document.getElementById("editorSaveText");
    if(sb) sb.textContent = ed.saveText;
  }

  /* 1. 首页总览与回忆问答 */
  const QA_SUGGESTIONS = [
    "我上次去海边出差是什么时候，当时怎么放松的？",

  function runMemoryQa(question){
    const qText = (question || "").trim();
    if(!qText) return;
    if(!state.aiConfig.enabled){
      showToast("请先在设置中开启模型服务，再使用回忆问答");
      openSettingsDrawer("ai");
      return;
    }
    state.qa.collapsed = false;
    state.qa.loading = true;
    state.qa.messages.push({ role: "user", text: qText });
    renderHome();

    setTimeout(() => {
      const stopWords = ["什么","时候","怎么","哪些","我在","我的","最近","上次","前几","一下","都是","当时","的","了","吗","呢"];
      const tokens = qText.replace(/[？?！!，,。.\s]+/g, " ").split(" ").filter(Boolean);
      const keywords = [];
      tokens.forEach(tok => {
        ["海边","出差","海风","慢跑","阅读","复盘","疲惫","桌面","11-20","11 月 20 日","银杏","花架","早睡","老搭档","暖光灯","涮肉"].forEach(k => {
          if(tok.includes(k) || qText.includes(k)) keywords.push(k);
        });
        if(tok.length >= 2 && !stopWords.includes(tok)) keywords.push(tok);
      });
      const uniqKeys = [...new Set(keywords)];
      const scored = state.entries.map(e => {
        const plain = `${e.date} ${e.title} ${e.aiShortTitle||""} ${e.aiSummary||""} ${stripHtml(e.html)} ${e.tags.join(" ")} ${e.moods.join(" ")}`;
        let score = 0;
        uniqKeys.forEach(k => {
          if(k === "11 月 20 日" || k === "11-20"){
            if(e.date.slice(5) === "11-20") score += 4;
          } else if(plain.includes(k)){
            score += 2;
          }
        });
        if(qText.includes("规律") || qText.includes("复盘")){
          if(e.tags.includes("反省总结") || e.tags.includes("年度复盘")) score += 3;
        }
        return { entry: e, score };
      }).filter(x => x.score > 0).sort((a,b) => b.score - a.score);

      const hits = (scored.length ? scored.slice(0, 3) : state.entries.slice(0, 2)).map(x => x.entry);
      const citeIds = hits.map(h => ({ id: h.id, label: `${h.date} · ${h.aiShortTitle || h.title}` }));
      const traceSteps = [
        `1. 目录与摘要筛查（条件：关键词 ${uniqKeys.length ? uniqKeys.slice(0,4).join(" / ") : "近30天活跃记录"}）→ 初筛命中 ${hits.length} 篇`,
        `2. 指定日期原文精读（只读读取 ${hits.map(h => h.date).join("、")} 正文段落，共 ${hits.reduce((a,b)=>a+countWords(b.html),0)} 字）`,
        `3. 整理答复并核对日期出处 · 耗时 0.8 秒 · 参考消耗约 1,420 词元`
      ];

      let answer = "";
      if(qText.includes("海边") || qText.includes("出差") || qText.includes("海风")){
        answer = "翻阅过往记录，最近一次去海边出差是在 2026 年 11 月 2 日：\n• 白天与团队对齐了冬季产品清单，现场演示进行得很顺利；\n• 傍晚五点收工后，你沿着海岸线散步四公里吹海风，还拍到橘子海落日，一整天的疲惫一下散掉。";
      } else if(qText.includes("疲惫") || qText.includes("复盘") || qText.includes("规律")){
        answer = "从最近的复盘与情绪记录里可以看到两条很稳定的自我调节规律：\n• 节奏上：拖慢进度往往不是事情难，而是同时开了太多分支（2026-11-10 复盘决定每天只锁死最重要的一件事）；\n• 恢复方式：身体发僵时做拉伸泡热水澡，或抽空做十公里慢跑与整理书桌，情绪上头前先停十秒，状态很快就能回暖。";
      } else if(qText.includes("11 月 20") || qText.includes("11-20") || qText.includes("往年")){
        answer = "过去三年的 11 月 20 日都留下了很有生活温度的节点记录：\n• 2023 年：安装好落地暖光灯，正式布置完阅读角并开启早睡计划；\n• 2024 年：组装了阳台实木花架，把绿植挪到向阳窗边并试做炖牛腩；\n• 2025 年：写满两年半，晚间整理书架重温旧日记，中午和老搭档敲定了来年方向。";
      } else {
        answer = `为你翻查到本地日记库中 ${hits.length} 篇关联度较高的记录：\n` +
          hits.map(h => `• ${h.date}（${h.moods.join(" ")}）：${h.aiSummary || stripHtml(h.html).slice(0, 72)}`).join("\n") +
          "\n点击下方出处胶囊即可直接打开对应日记原文。";
      }

      state.qa.loading = false;
      state.qa.messages.push({
        role: "ai",
        text: answer,
        traces: traceSteps,
        traceOpen: false,
        cites: citeIds
      });
      renderHome();
    }, 360);
  }

            <div style="font-size:11px;color:var(--ink-3);margin-top:2px">较当前版本无内容缺失 · 可随时一键恢复</div>
          </div>
          <div class="sub-card" style="padding:10px 12px;margin-bottom:0">
            <div style="font-size:12px;font-weight:800">23:15 · 刚打开时基线</div>
            <div style="font-size:11px;color:var(--ink-3);margin-top:2px">若误删整段可直接从此基线找回</div>
          </div>
        </div>`;
    }
    const cb = document.getElementById("closePopBtn");
    if(cb) cb.onclick = () => { ed.popover = null; renderEditorPopover(); };
  }

  let autoSaveTimer = null;
  function scheduleAutoSave(){
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(() => { saveCurrentEditor(); }, 450);
  }

  /* 编辑器斜杠菜单、快捷语法、划词工具条、图片插入绑定 */
  function saveCurrentSelection(canvas){
    const sel = window.getSelection();
    if(sel && sel.rangeCount > 0 && canvas.contains(sel.anchorNode)){
      savedSelectionRange = sel.getRangeAt(0).cloneRange();
    }
  }

  function insertHtmlAtSavedCursor(canvas, htmlStr){
    canvas.focus();
    const sel = window.getSelection();
    if(savedSelectionRange && canvas.contains(savedSelectionRange.startContainer)){
      sel.removeAllRanges();
      sel.addRange(savedSelectionRange);
    }
    document.execCommand("insertHTML", false, htmlStr);
    state.editor.html = canvas.innerHTML;
    refreshEditorWordCount(canvas);
    scheduleAutoSave();
  }

  function refreshEditorWordCount(canvas){
    state.editor.html = canvas.innerHTML;
    const wc = countWords(state.editor.html);
    const pill = document.getElementById("edWordCountPill");
    if(pill) pill.textContent = `正文 ${wc} 字`;
  }

  function hideEditorPopups(){
    slashMenu.classList.add("hidden");
    floatBar.classList.add("hidden");
  }

  function bindRichEditor(canvas){
    canvas.addEventListener("input", () => {
      refreshEditorWordCount(canvas);
      const sb = document.getElementById("editorSaveText");
      if(sb) sb.textContent = "正在保存…";
      scheduleAutoSave();

      // 1. 快捷符号识别（行首 ###  / -  / > ）
      const sel = window.getSelection();
      if(sel && sel.rangeCount){
        const node = sel.anchorNode;
        if(node && node.nodeType === 3){
          const txt = node.textContent;
          const off = sel.anchorOffset;
          const before = txt.slice(0, off);
          if(before === "### "){
            node.textContent = txt.slice(4);
            document.execCommand("formatBlock", false, "H3");
            return;
          } else if(before === "## "){
            node.textContent = txt.slice(3);
            document.execCommand("formatBlock", false, "H2");
            return;
          } else if(before === "- "){
            node.textContent = txt.slice(2);
            document.execCommand("insertUnorderedList", false);
            return;
          } else if(before === "> "){
            node.textContent = txt.slice(2);
            document.execCommand("formatBlock", false, "BLOCKQUOTE");
            return;
          }
          // 2. 斜杠命令识别（只要光标前刚输入 / 且处于空位或空格后）
          if(before.endsWith("/") && (before.length === 1 || /\s/.test(before[before.length-2]))){
            openSlashMenu(sel, node, off, canvas);
            return;
          }
        }
      }
      if(!slashMenu.classList.contains("hidden")){
        slashMenu.classList.add("hidden");
      }
    });

    canvas.addEventListener("keydown", (e) => {
      if(!slashMenu.classList.contains("hidden")){
        if(e.key === "ArrowDown"){ e.preventDefault(); slashActiveIdx = (slashActiveIdx + 1) % SLASH_COMMANDS.length; renderSlashItems(canvas); }
        else if(e.key === "ArrowUp"){ e.preventDefault(); slashActiveIdx = (slashActiveIdx - 1 + SLASH_COMMANDS.length) % SLASH_COMMANDS.length; renderSlashItems(canvas); }
        else if(e.key === "Enter"){ e.preventDefault(); execSlashCommand(SLASH_COMMANDS[slashActiveIdx].key, canvas); }
        else if(e.key === "Escape"){ e.preventDefault(); slashMenu.classList.add("hidden"); }
      }
    });

    canvas.addEventListener("mouseup", () => showFloatBarIfSelected(canvas));
    canvas.addEventListener("keyup", () => showFloatBarIfSelected(canvas));

    // 支持直接粘贴剪贴板图片
    canvas.addEventListener("paste", (e) => {
      const items = (e.clipboardData && e.clipboardData.items) || [];
      for(const it of items){
        if(it.type.startsWith("image/")){
          e.preventDefault();
          const file = it.getAsFile();
          const reader = new FileReader();
          reader.onload = () => {
            saveCurrentSelection(canvas);
            insertHtmlAtSavedCursor(canvas, `<div class="img-block" contenteditable="false"><img src="${reader.result}" alt="日记配图"><div class="img-caption" contenteditable="true">点击填写图片说明</div></div><p></p>`);
            showToast("已将剪贴板图片插入日记正文");
          };
          reader.readAsDataURL(file);
          return;
        }
      }
    });
  }

  function openSlashMenu(sel, textNode, offset, canvas){
    const range = sel.getRangeAt(0).cloneRange();
    slashRangeInfo = { textNode, offset };
    const rect = range.getBoundingClientRect();
    let left = Math.min(rect.left || 240, window.innerWidth - 270);
    let top = (rect.bottom || 240) + 8;
    if(top + 320 > window.innerHeight) top = Math.max(20, (rect.top || 300) - 320);
    slashMenu.style.left = left + "px";
    slashMenu.style.top = top + "px";
    slashActiveIdx = 0;
    renderSlashItems(canvas);
    slashMenu.classList.remove("hidden");
  }

  function renderSlashItems(canvas){
    slashMenu.innerHTML = `<div class="slash-menu-head">插入或切换块类型（↑↓ 选，回车确认）</div>` +
      SLASH_COMMANDS.map((c, idx) => `
        <button class="slash-item ${idx===slashActiveIdx?"active":""}" data-slash-key="${c.key}">
          <span class="slash-icon">${c.icon}</span>
          <span>
            <div class="slash-name">${escHtml(c.name)}</div>
            <div class="slash-desc">${escHtml(c.desc)}</div>
          </span>
        </button>
      `).join("");
    slashMenu.querySelectorAll("[data-slash-key]").forEach(btn => {
      btn.onmousedown = (e) => { e.preventDefault(); execSlashCommand(btn.dataset.slashKey, canvas); };
    });
  }

  function execSlashCommand(key, canvas){
    slashMenu.classList.add("hidden");
    // 删除触发的斜杠字符
    if(slashRangeInfo && slashRangeInfo.textNode && slashRangeInfo.textNode.parentNode){
      const tn = slashRangeInfo.textNode;
      const idx = slashRangeInfo.offset - 1;
      if(idx >= 0 && tn.textContent[idx] === "/"){
        tn.textContent = tn.textContent.slice(0, idx) + tn.textContent.slice(idx + 1);
        const r = document.createRange();
        r.setStart(tn, idx);
        r.collapse(true);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
        savedSelectionRange = r.cloneRange();
      }
    }
    canvas.focus();
    if(key === "h3") document.execCommand("formatBlock", false, "H3");
    else if(key === "h2") document.execCommand("formatBlock", false, "H2");
    else if(key === "p") document.execCommand("formatBlock", false, "P");
    else if(key === "ol") document.execCommand("insertOrderedList", false);
    else if(key === "ul") document.execCommand("insertUnorderedList", false);
    else if(key === "quote") document.execCommand("formatBlock", false, "BLOCKQUOTE");
    else if(key === "code") insertHtmlAtSavedCursor(canvas, `<pre><code>// 在此输入代码或命令记录</code></pre><p></p>`);
    else if(key === "hr") insertHtmlAtSavedCursor(canvas, `<hr><p></p>`);
    else if(key === "todo") insertHtmlAtSavedCursor(canvas, `<div class="todo-block"><input type="checkbox" onclick="this.parentElement.classList.toggle('done',this.checked)"><span class="todo-text" contenteditable="true">待办事项内容</span></div><p></p>`);
    else if(key === "img-demo"){
      const svg = encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFE8A3"/><stop offset="55%" stop-color="#FFD480"/><stop offset="100%" stop-color="#F8B488"/></linearGradient></defs><rect width="800" height="360" fill="url(#g)"/><circle cx="620" cy="110" r="56" fill="#FFF7D6" opacity="0.85"/><path d="M0 280 Q210 210 420 265 T800 245 L800 360 L0 360 Z" fill="#2A3447" opacity="0.85"/><text x="48" y="325" font-family="sans-serif" font-size="22" font-weight="bold" fill="#FFF7E6">傍晚江边落日散步 · 本地原图随笔演示</text></svg>`);
      insertHtmlAtSavedCursor(canvas, `<div class="img-block" contenteditable="false"><img src="data:image/svg+xml,${svg}" alt="示例配图"><div class="img-caption" contenteditable="true">本地配图示例：支持直接复制截图粘贴或选取本地照片上传至绿联存储</div></div><p></p>`);
    }
    else if(key === "img-local") imagePickerInput.click();

    refreshEditorWordCount(canvas);
    scheduleAutoSave();
  }

  function showFloatBarIfSelected(canvas){
    const sel = window.getSelection();
    if(!sel || sel.isCollapsed || !sel.toString().trim() || !canvas.contains(sel.anchorNode)){
      floatBar.classList.add("hidden");
      return;
    }
    savedSelectionRange = sel.getRangeAt(0).cloneRange();
    const rect = savedSelectionRange.getBoundingClientRect();
    floatBar.style.left = Math.max(12, Math.min(window.innerWidth - 260, rect.left + rect.width/2 - 115)) + "px";
    floatBar.style.top = Math.max(10, rect.top - 42) + "px";
    floatBar.classList.remove("hidden");
  }

  floatBar.querySelectorAll("[data-fmt]").forEach(btn => {
    btn.onmousedown = (e) => {
      e.preventDefault();
      const canvas = document.getElementById("editorCanvas");
      if(!canvas) return;
      if(savedSelectionRange){
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedSelectionRange);
      }
      const f = btn.dataset.fmt;
      if(f === "bold") document.execCommand("bold");
      else if(f === "italic") document.execCommand("italic");
      else if(f === "strike") document.execCommand("strikeThrough");
      else if(f === "highlight"){
        const txt = window.getSelection().toString();
        document.execCommand("insertHTML", false, `<mark>${escHtml(txt)}</mark>`);
      }
      floatBar.classList.add("hidden");
      refreshEditorWordCount(canvas);
      scheduleAutoSave();
    };
  });

  imagePickerInput.onchange = () => {
    const file = imagePickerInput.files && imagePickerInput.files[0];
    const canvas = document.getElementById("editorCanvas");
    if(!file || !canvas) return;
    const reader = new FileReader();
    reader.onload = () => {
      insertHtmlAtSavedCursor(canvas, `<div class="img-block" contenteditable="false"><img src="${reader.result}" alt="本地上传图片"><div class="img-caption" contenteditable="true">${escHtml(file.name)}</div></div><p></p>`);
      showToast(`已插入本地图片：${file.name}`);
    };
    reader.readAsDataURL(file);
    imagePickerInput.value = "";
  };

  /* 3. 日历视图 */
  function renderCalendar(){
    const y = state.calYear, m = state.calMonth;
    const first = new Date(y, m, 1);
    const startOffset = (first.getDay() + 6) % 7;
    const gridStart = new Date(y, m, 1 - startOffset);
    const aiOn = state.aiConfig.enabled;
    const defaultTag = state.tags[0] ? state.tags[0].name : "日常记录";
    let cells = "";
    for(let i=0;i<42;i++){
      const d = new Date(gridStart);
      d.setDate(gridStart.getDate() + i);
      const ds = fmtDate(d);
      const isCur = d.getMonth() === m;
      const isToday = ds === "2026-11-20";
      const real = state.entries.find(e => e.kind === "daily" && e.date === ds);
      const rec = real ? {
        date: ds,
        mood: real.moods[0] || "😌 平静",
        title: real.title,
        aiShortTitle: real.aiShortTitle,
        aiReady: real.aiReady !== false,
        wc: countWords(real.html),
        tags: real.tags
      } : (heatMap[ds] ? { ...heatMap[ds], tags: [defaultTag] } : null);
      const tObj = rec ? (state.tags.find(x=>x.name===rec.tags[0]) || state.tags[0] || TAG_PALETTE[0]) : null;
      const tColor = tObj ? tObj.color : "";
      const hasAiTitle = rec && aiOn && rec.aiReady && rec.aiShortTitle;
      const needRecalc = rec && aiOn && !rec.aiReady;
      const shownTitle = hasAiTitle ? rec.aiShortTitle : (rec ? rec.title : "");
      cells += `
        <div class="cal-cell ${isCur?"":"other-month"} ${isToday?"today":""}" data-cal-date="${ds}" role="button" tabindex="0">
          <div class="cal-cell-top">
            <span class="num">${d.getDate()}</span>
            <span style="display:inline-flex;align-items:center;gap:4px">
              ${hasAiTitle ? `<span title="智能短标题" style="color:var(--ai-ink);font-size:11px;font-weight:900">✦</span>` : ""}
              <span>${rec ? escHtml(rec.mood.split(" ")[0]) : ""}</span>
            </span>
          </div>
          ${rec ? `
            <div class="cal-cell-title">${escHtml(shownTitle)}</div>
            <div class="cal-cell-foot">
              ${needRecalc ? `
                <button class="cal-recalc-btn" data-recalc-date="${ds}" title="按需补算这一天的模型概要">✦ 补算概要</button>
              ` : `
                <span style="display:inline-flex;align-items:center;gap:4px"><i style="width:6px;height:6px;border-radius:50%;background:${tColor};display:inline-block"></i>${escHtml(rec.tags[0]||defaultTag)}</span>
              `}
              <span class="num">${rec.wc}字</span>
            </div>
          ` : `<div class="cal-empty-hint">+ 补写这天</div>`}
        </div>`;
    }

    mainWrap.innerHTML = `
      <div class="cal-head">
        <div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <h1 style="margin:0;font-size:32px;font-weight:900;letter-spacing:-.02em" class="num">${y} 年 ${m+1} 月</h1>
            ${aiOn ? `<span class="ai-badge">✦ 格子展示智能短标题</span>` : `<span class="raw-badge">已降级为原标题</span>`}
          </div>
          <div style="font-size:13px;color:var(--ink-3);font-weight:600;margin-top:4px">点击任意日期格直接阅读、续写或补写日记；未总结日期可点「✦ 补算概要」按需生成</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="btn btn-ghost" id="calPrevBtn">← 上个月</button>
          <button class="btn btn-soft" id="calTodayBtn">回到本月</button>
          <button class="btn btn-ghost" id="calNextBtn">下个月 →</button>
        </div>
      </div>
      <div class="card cal-card">
        <div class="cal-weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div class="cal-grid">${cells}</div>
      </div>
    `;

    document.getElementById("calPrevBtn").onclick = () => {
      if(state.calMonth === 0){ state.calYear--; state.calMonth = 11; } else state.calMonth--;
      renderCalendar();
    };
    document.getElementById("calNextBtn").onclick = () => {
      if(state.calMonth === 11){ state.calYear++; state.calMonth = 0; } else state.calMonth++;
      renderCalendar();
    };
    document.getElementById("calTodayBtn").onclick = () => { state.calYear = 2026; state.calMonth = 10; renderCalendar(); };
    mainWrap.querySelectorAll("[data-recalc-date]").forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const ds = btn.dataset.recalcDate;
        const real = state.entries.find(x => x.kind === "daily" && x.date === ds);
        if(real){
          real.aiReady = true;
          if(!real.aiShortTitle) real.aiShortTitle = real.title.slice(0, 16);
        }
        if(heatMap[ds]){
          heatMap[ds].aiReady = true;
          if(!heatMap[ds].aiShortTitle) heatMap[ds].aiShortTitle = (real && real.aiShortTitle) || "完成当天核心事件记录，心态平稳";
        }
        showToast(`✦ 已为 ${ds} 按需生成并缓存智能概要`);
        renderCalendar();
      };
    });
    mainWrap.querySelectorAll("[data-cal-date]").forEach(b => {
      b.onclick = () => openEditorForDate(b.dataset.calDate);
    });

  /* 4. 历史与全文检索 */
  function highlightText(text, q){
    const safe = escHtml(text);
    if(!q) return safe;
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    return safe.replace(re, m => `<mark class="search-hl">${m}</mark>`);
  }

  function getDateRangeForPreset(preset){
    if(preset === "7d") return { start: "2026-11-14", end: "2026-11-20" };
    if(preset === "30d") return { start: "2026-10-22", end: "2026-11-20" };
    if(preset === "month") return { start: "2026-11-01", end: "2026-11-30" };
    if(preset === "thisYear") return { start: "2026-01-01", end: "2026-12-31" };
    if(preset === "lastYear") return { start: "2025-01-01", end: "2025-12-31" };
    if(preset === "2024") return { start: "2024-01-01", end: "2024-12-31" };
    if(preset === "2023") return { start: "2023-01-01", end: "2023-12-31" };
    if(preset === "custom") return { start: state.histStart, end: state.histEnd };
    return { start: "", end: "" };
  }

  function getFilteredHistoryEntries(){
    const q = state.histQuery.trim().toLowerCase();
    const range = getDateRangeForPreset(state.histPreset);
    return state.entries.filter(e => {
      if(state.histKind !== "all" && e.kind !== state.histKind) return false;
      if(range.start && e.date < range.start) return false;
      if(range.end && e.date > range.end) return false;
      if(state.histTag !== "all" && !e.tags.includes(state.histTag)) return false;
      if(state.histMood !== "all" && !e.moods.includes(state.histMood)) return false;
      if(q){
        const hay = `${e.date} ${e.title} ${e.aiShortTitle||""} ${e.aiSummary||""} ${stripHtml(e.html)} ${e.tags.join(" ")}`.toLowerCase();
        if(!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function renderHistory(){

    const filtered = getFilteredHistoryEntries();
    const sumWords = filtered.reduce((acc, e) => acc + countWords(e.html), 0);

    ];

        </select>
        <button class="btn btn-soft" id="fResetBtn" style="height:36px">重置筛选</button>
      </div>

      <div id="histResultsMount"></div>
    `;

    renderHistoryResults(filtered, q);

    const sInput = document.getElementById("histSearchInput");
    sInput.oninput = () => {
      state.histQuery = sInput.value;
      const newQ = state.histQuery.trim();
      const nextFiltered = getFilteredHistoryEntries();
      const nextWords = nextFiltered.reduce((acc, e) => acc + countWords(e.html), 0);
      const pill = document.getElementById("histCountPill");
      if(pill) pill.textContent = `${nextFiltered.length} 篇 · ${nextWords.toLocaleString()} 字${newQ ? " · 12 毫秒" : ""}`;
      renderHistoryResults(nextFiltered, newQ);
    };
    const clearBtn = document.getElementById("clearSearchBtn");
    if(clearBtn) clearBtn.onclick = () => { state.histQuery = ""; renderHistory(); };

    mainWrap.querySelectorAll("[data-h-preset]").forEach(btn => {
      btn.onclick = () => {
        state.histPreset = btn.dataset.hPreset;
        if(state.histPreset !== "custom"){
          const r = getDateRangeForPreset(state.histPreset);

      });

      document.getElementById("addMoodBtn").onclick = () => {
        const em = document.getElementById("newMoodEmojiInput").value.trim() || "🙂";
        const nm = document.getElementById("newMoodNameInput").value.trim();
        if(!nm) return;
        const label = `${em} ${nm}`;
        if(state.moods.some(m => m.label === label)){ showToast("已存在相同心情"); return; }
        const tones = ["#22C55E","#F59E0B","#64748B","#8B5CF6","#3B82F6","#F97316","#EF4444","#BE123C"];
        state.moods.push({ id: "m-" + Date.now(), emoji: em, name: nm, label, tone: tones[state.moods.length % tones.length], level: 3, count: 0 });
        renderSettingsTabBody();
        render();
        showToast(`已新增心情「${label}」`);
      };
      body.querySelectorAll("[data-edit-mood]").forEach(btn => {
        btn.onclick = () => { editingMoodId = btn.dataset.editMood; renderSettingsTabBody(); };
      });
      body.querySelectorAll("[data-save-mood]").forEach(btn => {
        btn.onclick = () => {
          const mid = btn.dataset.saveMood;
          const m = state.moods.find(x => x.id === mid);
          const em = body.querySelector(`[data-edit-memoji="${mid}"]`).value.trim() || m.emoji;
          const nm = body.querySelector(`[data-edit-mname="${mid}"]`).value.trim() || m.name;
          const oldLabel = m.label;
          const newLabel = `${em} ${nm}`;
          m.emoji = em; m.name = nm; m.label = newLabel;
          state.entries.forEach(e => { e.moods = e.moods.map(x => x === oldLabel ? newLabel : x); });
          state.editor.moods = state.editor.moods.map(x => x === oldLabel ? newLabel : x);
          if(state.histMood === oldLabel) state.histMood = newLabel;
          editingMoodId = null;
          renderSettingsTabBody();
          render();
          showToast(`已更新心情为「${newLabel}」`);
        };
      });
      body.querySelectorAll("[data-del-mood]").forEach(btn => {
        btn.onclick = () => {
          const m = state.moods.find(x => x.id === btn.dataset.delMood);
          if(!m) return;
          if((m.count || 0) <= 0){
            if(state.moods.length <= 1){ showToast("至少保留 1 项心情"); return; }
            state.moods = state.moods.filter(x => x.id !== m.id);
            renderSettingsTabBody();
            render();
            showToast(`已删除心情「${m.label}」`);
          } else {
            openMoodMigrateModal(m);
          }
        };
      });
    } else if(activeSettingsTab === "import"){
      const imp = state.importDemo;
      body.innerHTML = `
        <div class="sub-card">
          <div style="font-size:15px;font-weight:800">从原平台导出压缩包一键无损导入</div>
          <div style="font-size:12px;color:var(--ink-3);margin-top:4px;line-height:1.6">在原平台点「导出 → 包含全部子页面的通用文本与表格压缩包」，上传后本向导将本地自动完成解析与核对。</div>
          ${imp.step === 1 ? `
            <div style="margin-top:14px;padding:24px;border:1.5px dashed var(--border-strong);border-radius:14px;text-align:center;background:var(--surface)">
              <div style="font-size:14px;font-weight:800;margin-bottom:8px">体验导入核对流程</div>
              <button class="btn btn-primary" id="simUploadZipBtn" style="height:40px;font-size:13px">载入模拟 1,244 篇原平台导出包</button>
            </div>
          ` : imp.step === 2 ? `
            <div style="margin-top:14px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--border)">
              <div style="font-size:13px;font-weight:800;color:var(--ok-ink);margin-bottom:8px">✓ 解析完成，请核对汇总明细：</div>
              <ul style="margin:0 0 12px;padding-left:18px;font-size:12.5px;line-height:1.8;color:var(--ink-2)">
                <li>识别有效日记：<b>1,244 篇</b>（2023-06-25 至 2026-11-19）</li>
                <li>合计正文有效字数：<b>852,980 字</b></li>
                <li>自动剥离标题重复日期前缀：<b>1,244 篇</b></li>
                <li>自动跳过无日期空白占位草稿：<b>3 条</b></li>
                <li>匹配标签 9 项，旧 12 项心情已自动归并至新 8 档核心心情，异常：<b>0 条</b></li>
              </ul>
              <div style="padding:10px;border-radius:11px;background:var(--surface-hover);border:1px solid var(--line);margin-bottom:12px">
                <div style="font-size:12px;font-weight:800;margin-bottom:6px">旧 12 项心情 → 新 8 档自动归并映射表（导入前可核对）</div>
                <div style="display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--ink-2)">
                  ${OLD_MOOD_MAP_DEMO.map(row => `
                    <div style="display:flex;justify-content:space-between;gap:8px">
                      <span>${escHtml(row.oldLabel)}</span>
                      <span style="font-weight:800">→ ${escHtml(row.newLabel)}（<span class="num">${row.count}</span> 篇）</span>
                    </div>
                  `).join("")}
                </div>
              </div>
              <div style="display:flex;gap:8px">
                <button class="btn btn-primary" id="simConfirmImpBtn" style="height:38px;font-size:13px;flex:1">确认无损入库</button>
                <button class="btn btn-soft" id="simResetImpBtn" style="height:38px">取消</button>
              </div>
            </div>
          ` : `
            <div style="margin-top:14px;padding:14px;border-radius:14px;background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok-ink)">
              <div style="font-size:14px;font-weight:800">🎉 历史搬家已完成（批次 #20261120-01）</div>
              <div style="font-size:12px;margin:4px 0 12px">1,244 篇日记与标签、8 档心情、全文索引均已入库，可在「模型服务」随时批量补齐智能摘要。</div>
              <button class="btn btn-danger-soft" id="simUndoImpBtn">按批次一键撤销本次导入</button>
            </div>
          `}
        </div>
      `;
      const b1 = document.getElementById("simUploadZipBtn");
      if(b1) b1.onclick = () => { imp.step = 2; renderSettingsTabBody(); };
      const b2 = document.getElementById("simConfirmImpBtn");
      if(b2) b2.onclick = () => { imp.step = 3; renderSettingsTabBody(); showToast("已导入 1,244 篇历史日记（原型演示）"); };
      const b3 = document.getElementById("simResetImpBtn");
      if(b3) b3.onclick = () => { imp.step = 1; renderSettingsTabBody(); };
      const b4 = document.getElementById("simUndoImpBtn");
      if(b4) b4.onclick = () => { imp.step = 1; renderSettingsTabBody(); showToast("已安全回滚本次导入批次"); };
    } else if(activeSettingsTab === "backup"){
      body.innerHTML = `
        <div class="sub-card">
          <div style="font-size:14px;font-weight:800">每日自动双备份（绿联挂载目录 /data/backups）</div>
          <div style="font-size:12px;color:var(--ink-3);margin:6px 0 12px;line-height:1.6">每晚自动在线热备数据库文件并保留最近 30 份；每周额外输出通用可读文本备份压缩包，彻底摆脱平台锁定。</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <button class="btn btn-dark" id="expJsonBtn" style="height:36px">导出全量数据包</button>
            <button class="btn btn-soft" id="expMdBtn" style="height:36px">导出纯文本压缩包</button>
          </div>
        </div>
        <div class="sub-card">
          <div style="font-size:14px;font-weight:800;margin-bottom:8px">30 天回收站（${state.trash.length} 篇）</div>
          ${state.trash.length ? state.trash.map((tr, i) => `
            <div style="display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px">
              <div>
                <div style="font-size:13px;font-weight:800">${escHtml(tr.date)} · ${escHtml(tr.title)}</div>
                <div style="font-size:11px;color:var(--ink-3)">${tr.words} 字 · 删除于 ${tr.deletedAt}</div>
              </div>
              <button class="btn btn-soft" data-restore-tr="${i}" style="height:30px;padding:0 10px;font-size:12px">恢复</button>
            </div>
          `).join("") : `<div style="font-size:12px;color:var(--ink-3)">回收站暂无误删记录。</div>`}
        </div>
      `;
      document.getElementById("expJsonBtn").onclick = () => showToast("已生成全量数据备份包（原型演示）");
      document.getElementById("expMdBtn").onclick = () => showToast("已生成标准可携纯文本压缩包（原型演示）");
      body.querySelectorAll("[data-restore-tr]").forEach(b => {
        b.onclick = () => {
          const item = state.trash.splice(Number(b.dataset.restoreTr), 1)[0];
          renderSettingsTabBody();
          showToast(`已从回收站还原：${item.title}`);
        };
      });
    }
  }

  /* ================== 全局事件绑定 ================== */
  document.getElementById("brandBtn").onclick = () => navigate("home");
  document.querySelectorAll("[data-view]").forEach(btn => {
    btn.onclick = () => navigate(btn.dataset.view);
  });
  document.getElementById("themeToggleBtn").onclick = () => {
    state.theme = state.theme === "light" ? "dark" : "light";
    applyThemeAndDevice();
    render();
    showToast(state.theme === "dark" ? "已切换至夜间护眼深色模式" : "已切换至浅色护眼模式");
  };
  document.querySelectorAll("[data-device-btn]").forEach(btn => {
    btn.onclick = () => {
      state.device = btn.dataset.deviceBtn;
      applyThemeAndDevice();
      render();
    };
  });
  document.getElementById("syncPillBtn").onclick = () => {
    state.syncMode = state.syncMode === "ok" ? "syncing" : state.syncMode === "syncing" ? "offline" : "ok";
    applyThemeAndDevice();
    showToast(state.syncMode === "ok" ? "模拟：已连接绿联服务端并同步" : state.syncMode === "syncing" ? "模拟：正在同步草稿…" : "模拟：断网中，写作内容自动安全暂存本地");
  };
  document.getElementById("openSettingsBtn").onclick = () => openSettingsDrawer();

  window.addEventListener("scroll", () => {
    topbarWrap.classList.toggle("scrolled", window.scrollY > 8);
  });
  appFrame.addEventListener("scroll", () => {
    topbarWrap.classList.toggle("scrolled", appFrame.scrollTop > 8);
  });
  document.addEventListener("mousedown", (e) => {
    if(!e.target.closest("#slashMenu")) slashMenu.classList.add("hidden");
    if(!e.target.closest("#floatBar") && !e.target.closest("#editorCanvas")) floatBar.classList.add("hidden");
  });

  applyThemeAndDevice();
  updateNavActive();
  render();
})();
</script>
</body>
</html>
